help: |
  <b>OpenSong Module</b>
  Automatically discovers random songs on Spotify, downloads audio via YouTube, and posts them to the chat on a schedule with Like/Dislike voting and optional DM approval.

  <b>Commands:</b>
  • <code>/opensong</code> — Settings menu
  • <code>/player</code> — Interactive music player (Prev/Next/Save)
  • <code>/opensong_send</code> — Send a random song now
  • <code>/opensong_top</code> — Top liked songs in chat
  • <code>/opensong_approver @username</code> — Change approver username

settings:
  title: "<b>OpenSong Settings — {chat_title}</b>"
  info: |
    <b>OpenSong Settings — {chat_title}</b>

    <b>Auto-Send:</b> {status_text}
    <b>Interval:</b> Every {interval}h
    <b>Next song:</b> {next_run}
    <b>Pin message:</b> {pin_text}
    <b>Unpin previous:</b> {unpin_text}
    <b>DM approval:</b> {approval_text}
    <b>Approver:</b> @{approver}
    <b>Duration limit:</b> {max_duration} min
    <b>Genres:</b> {genres_count}/{total_genres} selected
  enabled: Enabled
  disabled: Disabled
  enabled_short: On
  disabled_short: Off
  interval_header: |
    <b>Interval Settings</b>
    Current schedule: every {interval}h.

