help: |
  <b>Модуль OpenSong</b>
  Поиск случайных треков в Spotify, скачивание аудио с YouTube и отправка в чат по расписанию с голосованием и возможностью подтверждения в ЛС.

  <b>Команды:</b>
  • <code>/opensong</code> — Меню настроек
  • <code>/player</code> — Музыкальный плеер (Предыдущая/Следующая/Сохранить)
  • <code>/opensong_send</code> — Отправить случайную песню сейчас
  • <code>/opensong_top</code> — Топ залайканных треков чата
  • <code>/opensong_approver @username</code> — Изменить пользователя для подтверждения

settings:
  title: "<b>Настройки OpenSong — {chat_title}</b>"
  info: |
    <b>Настройки OpenSong — {chat_title}</b>

    <b>Авто-отправка:</b> {status_text}
    <b>Интервал:</b> Каждые {interval} ч
    <b>Следующий трек:</b> {next_run}
    <b>Закрепление:</b> {pin_text}
    <b>Откреплять старые:</b> {unpin_text}
    <b>Подтверждение в ЛС:</b> {approval_text}
    <b>Кто подтверждает:</b> @{approver}
    <b>Лимит длительности:</b> {max_duration} мин
    <b>Жанры:</b> {genres_count}/{total_genres} выбрано
  enabled: Включено
  disabled: Выключено
  enabled_short: Вкл.
  disabled_short: Выкл.
  interval_header: |
    <b>Настройка интервала</b>
    Текущий: каждые {interval} ч.

    Выберите, как часто отправлять трек:
  genres_header: |
    <b>Настройка жанров</b>
    Выбрано {enabled_count} из {total_count} доступных:
  approver_header: |
    <b>Подтверждение треков в ЛС</b>
    Текущий пользователь: @{approver}

    Если подтверждение включено, бот отправляет аудио в ЛС пользователю перед публикацией в чат.
    (Пользователь должен хотя бы раз запустить бота через /start)
  btn_interval: "Интервал: {interval} ч"
  btn_duration: "Длительность: {duration} мин"
  btn_pin: "Закрепление: {status}"
  btn_unpin_prev: "Откреплять старые: {status}"
  btn_approval: "Подтверждение: {status}"
  btn_status: "Авто-отправка: {status}"
  btn_genres: "Жанры ({count})"
  btn_approver: "Проверяет: @{user}"
  btn_top: "Топ треков"
  btn_send_now: "Отправить сейчас"
  btn_refresh: "Обновить 🔄"
  btn_close: "Закрыть"
  btn_back: "← Назад"
