help: |
  <b>Модуль OpenSong</b>
  Пошук випадкових пісень у Spotify, завантаження аудіо з YouTube та надсилання в чат за розкладом із голосуванням і можливістю схвалення в ПП.

  <b>Команди:</b>
  • <code>/opensong</code> — Меню налаштувань
  • <code>/opensong_send</code> — Надіслати випадкову пісню зараз
  • <code>/opensong_top</code> — Топ найбільш залайканих пісень чату
  • <code>/opensong_approver @username</code> — Змінити користувача для схвалення

settings:
  title: "<b>Налаштування OpenSong — {chat_title}</b>"
  info: |
    <b>Налаштування OpenSong — {chat_title}</b>

    <b>Авто-надсилання:</b> {status_text}
    <b>Інтервал:</b> Кожні {interval} год
    <b>Наступна пісня:</b> {next_run}
    <b>Закріплення:</b> {pin_text}
    <b>Відкріплювати старі:</b> {unpin_text}
    <b>Схвалення в ПП:</b> {approval_text}
    <b>Хто схвалює:</b> @{approver}
    <b>Ліміт тривалості:</b> {max_duration} хв
    <b>Жанри:</b> {genres_count}/{total_genres} обрано
  enabled: Увімкнено
  disabled: Вимкнено
  enabled_short: Увімк.
  disabled_short: Вимк.
  interval_header: |
    <b>Налаштування інтервалу</b>
    Поточний: кожні {interval} год.

    Оберіть, як часто надсилати пісню:
  genres_header: |
    <b>Налаштування жанрів</b>
    Обрано {enabled_count} з {total_count} доступних:
  approver_header: |
    <b>Схвалення пісень у ПП</b>
    Поточний користувач: @{approver}

    Якщо схвалення увімкнено, бот надсилає аудіо в ПП користувачу перед публікацією в чат.
    (Користувач має хоча б раз запустити бота через /start)
  btn_interval: "Інтервал: {interval} год"
  btn_duration: "Тривалість: {duration} хв"
  btn_pin: "Закріплення: {status}"
  btn_unpin_prev: "Відкріплювати старі: {status}"
  btn_approval: "Схвалення: {status}"
  btn_status: "Авто-надсилання: {status}"
  btn_genres: "Жанри ({count})"
  btn_approver: "Схвалює: @{user}"
  btn_top: "Топ пісень"
  btn_send_now: "Надіслати зараз"
  btn_refresh: "Оновити 🔄"
  btn_close: "Закрити"
  btn_back: "← Назад"
  btn_enable_all: "Увімкнути всі"
  btn_disable_all: "Вимкнути всі"
  btn_set_me: "Призначити мене"
  btn_reset_default: "Скинути до конфігурації"
  prev_btn: "← Назад"
  next_btn: "Далі →"
  hours_suffix: "год"
  saved: "Налаштування збережено."
  no_permission: "Тільки адміністратори чату можуть змінювати налаштування."
  min_genres_error: "Має бути обрано хоча б один жанр."
